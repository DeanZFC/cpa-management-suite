<html lang="zh-CN">
<head>

  <style>
    :root{color-scheme:light;--bg:#f5f7f8;--surface:#fff;--soft:#f8fafb;--line:#e2e7ea;--strong:#d2dade;--text:#25313a;--muted:#7d8b94;--accent:#0da899;--accent-dark:#087f77;--accent-soft:#e2f7f4;--warning:#b67a18;--warning-soft:#fff3ce;--danger:#c54d55;--danger-soft:#fff0f1;--shadow:0 7px 24px rgba(38,58,67,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}main{max-width:1660px;margin:0 auto;padding:26px 32px 42px}.app-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 14px rgba(13,168,153,.22)}.brand h1{font-size:21px;margin:0;font-weight:750}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.head-actions,.section-actions,.row-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.key-field{width:250px}.field,.select,.key-field,.textarea{border:1px solid var(--strong);border-radius:8px;background:var(--surface);color:var(--text);outline:none;padding:0 12px}.field,.select,.key-field{height:40px}.textarea{display:block;width:100%;min-height:220px;padding:11px 12px;resize:vertical;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.field:focus,.select:focus,.key-field:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,168,153,.13)}.icon-button{width:40px;height:40px;padding:0;border:1px solid var(--strong);border-radius:8px;background:var(--surface);color:var(--text);font-size:20px;line-height:1}.icon-button:hover,.ghost:hover{background:var(--soft);border-color:var(--accent)}.primary{height:40px;border:1px solid var(--accent);border-radius:8px;padding:0 16px;background:var(--accent);color:#fff;font-weight:650}.primary:hover{background:var(--accent-dark)}.ghost{height:40px;border:1px solid var(--strong);border-radius:8px;padding:0 14px;background:var(--surface);color:var(--text)}.nav{display:flex;align-items:center;gap:4px;min-height:58px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:18px}.nav-tab{height:46px;padding:0 26px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:650}.nav-tab.active{background:var(--text);color:#fff}.content{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px 18px}.section-title{display:flex;align-items:baseline;gap:12px}.section-title h2{margin:0;font-size:22px}.count{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 9px;border-radius:14px;background:#edf0f1;color:#69767d;font-weight:700}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}.toggle input,.check{accent-color:var(--accent)}.menu-wrap{position:relative}.menu{position:absolute;z-index:10;right:0;top:46px;display:none;min-width:154px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}.menu.open{display:grid}.menu button{padding:9px 10px;border:0;border-radius:6px;background:transparent;text-align:left;color:var(--text)}.menu button:hover{background:var(--soft);color:var(--accent-dark)}.filters{display:grid;grid-template-columns:minmax(220px,1.8fr) repeat(3,minmax(150px,1fr));gap:12px;padding:0 24px 22px}.search{position:relative}.search .field{width:100%;padding-left:38px}.search-icon{position:absolute;left:13px;top:9px;color:var(--muted);font-size:19px}.bulk{display:none;align-items:center;gap:12px;padding:12px 24px;background:#effbf8;border-top:1px solid #d7f1ed;border-bottom:1px solid #d7f1ed;color:#176d65}.bulk.visible{display:flex}.bulk strong{font-size:14px}.bulk .field{height:34px;width:90px}.bulk-spacer{flex:1}.table-scroll{overflow:auto}.table{width:100%;min-width:1450px;border-collapse:collapse}.table th,.table td{height:68px;padding:12px 16px;border-top:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}.table th{height:52px;background:#fafbfb;color:#69777f;font-weight:650;font-size:13px}.table th:first-child,.table td:first-child{padding-left:24px}.table th:last-child,.table td:last-child{padding-right:24px}.check{width:17px;height:17px}.account{display:flex;align-items:center;gap:11px}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:9px;background:#e9f7f5;color:var(--accent-dark);font-weight:750}.account-name{font-weight:700;color:#2d3b43}.sub{display:block;margin-top:2px;color:var(--muted);font-size:12px;max-width:270px;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;gap:6px;align-items:center}.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;background:var(--accent-soft);color:#137d73;font-weight:600;font-size:12px}.chip.gray{background:#f0f3f4;color:#69777f}.capacity{display:inline-flex;align-items:center;gap:7px}.capacity .field{width:78px;height:34px;padding:0 8px;text-align:center}.capacity em{font-style:normal;color:var(--muted)}.meter{width:100px;height:6px;border-radius:4px;background:#e8edef;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}.meter i.warn{background:#e1a837}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;background:var(--accent-soft);color:#137d73;font-weight:650}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.off{background:var(--danger-soft);color:var(--danger)}.status.warn{background:var(--warning-soft);color:var(--warning)}.metric{font-variant-numeric:tabular-nums;color:#34434a}.cost{font-variant-numeric:tabular-nums;font-weight:650}.row-button{height:32px;padding:0 9px;border:1px solid var(--strong);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px}.row-button:hover{border-color:var(--accent);color:var(--accent-dark)}.row-button.danger:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center!important;color:var(--muted);height:180px!important}.footer{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;color:var(--muted);font-size:13px}.error{min-height:20px;padding:0 24px 10px;color:var(--danger);white-space:pre-wrap}.modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(24,36,42,.36)}.modal.open{display:flex;justify-content:flex-end}.drawer{width:min(720px,100%);height:100%;overflow:auto;padding:26px;background:var(--surface);box-shadow:-12px 0 32px rgba(24,36,42,.18)}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.drawer-head h2{margin:0;font-size:21px}.close{width:36px;height:36px;border:1px solid var(--strong);border-radius:8px;background:var(--surface);font-size:21px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-field{display:grid;gap:7px}.form-field.full{grid-column:1/-1}.form-field label{font-weight:650;color:#44535b}.form-field small{color:var(--muted);font-weight:400}.form-field .field,.form-field .select{width:100%}.switch-line{display:flex;align-items:center;gap:9px;height:40px}.switch-line input{width:17px;height:17px}.drawer-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.hint{margin:0 0 16px;padding:10px 12px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:12px}@media(max-width:900px){main{padding:16px}.app-head{align-items:flex-start;flex-direction:column}.head-actions{width:100%}.key-field{flex:1;min-width:220px}.nav{overflow:auto}.nav-tab{padding:0 18px}.section-head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.bulk{flex-wrap:wrap}.bulk-spacer{display:none}.footer{align-items:flex-start;flex-direction:column;gap:6px}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main>
    <header class="app-head"><div class="brand"><div class="brand-mark">C</div><div><h1>CPA 管理套件</h1><p>CLIProxyAPI 管理插件</p></div></div><div class="head-actions"><input id="key" class="key-field" type="password" placeholder="CPA Management Key" autocomplete="off"><button id="refresh" class="icon-button" title="刷新账号列表" aria-label="刷新账号列表">↻</button><button id="load" class="primary">加载账号</button></div></header>
    <nav class="nav" aria-label="管理模块"><button class="nav-tab active">账号管理</button></nav>
    <section class="content"><div class="section-head"><div class="section-title"><h2>账号管理</h2><span id="count" class="count">0</span></div><div class="section-actions"><button id="add" class="primary">添加账号</button><label class="toggle"><input id="auto" type="checkbox"> 自动刷新</label><div class="menu-wrap"><button id="more" class="ghost">⋯&nbsp; 更多操作</button><div id="menu" class="menu"><button id="reset">清空全部用量</button></div></div></div></div><div class="filters"><div class="search"><span class="search-icon">⌕</span><input id="search" class="field" placeholder="搜索账号、邮箱、文件名或类型"></div><select id="provider" class="select"><option value="">全部平台</option></select><select id="type" class="select"><option value="">全部类型</option></select><select id="status" class="select"><option value="">全部状态</option><option value="enabled">正常</option><option value="disabled">停用</option><option value="unavailable">不可用</option></select></div><div id="bulk" class="bulk"><strong>批量编辑账号</strong><span id="selected">已选择 0 个</span><span class="bulk-spacer"></span><label>容量 <input id="bulkCapacity" class="field" type="number" min="1" value="1"></label><button id="bulkSave" class="primary">批量更新</button><button id="bulkEnable" class="ghost">启用</button><button id="bulkDisable" class="ghost">停用</button></div><div id="error" class="error"></div><div class="table-scroll"><table class="table"><thead><tr><th><input id="all" class="check" type="checkbox" aria-label="选择全部账号"></th><th>名称</th><th>账号 ID</th><th>平台/类型</th><th>容量</th><th>当前并发</th><th>用量</th><th>成功率</th><th>Token</th><th>费用</th><th>状态</th><th>账号信息</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="13" class="empty">输入 CPA Management Key 后加载账号</td></tr></tbody></table></div><footer class="footer"><span id="summary">显示 0 个账号</span><span>价格来源：Models.dev</span></footer></section>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><aside class="drawer"><div class="drawer-head"><h2 id="drawerTitle">添加账号</h2><button id="close" class="close" title="关闭">×</button></div><p class="hint">认证内容只会提交给当前 CPA，列表不会展示密钥。CPA 认证文件必须是 JSON 对象。</p><div class="form-grid"><div class="form-field"><label for="fileName">认证文件名</label><input id="fileName" class="field" placeholder="例如 codex-account.json"></div><div class="form-field"><label for="filePicker">从文件载入</label><input id="filePicker" class="field" type="file" accept=".json,application/json"></div><div class="form-field full"><label for="json">认证 JSON</label><textarea id="json" class="textarea" spellcheck="false" placeholder='{"type":"codex", ...}'></textarea></div><div class="form-field"><label for="label">显示名称</label><input id="label" class="field" placeholder="账号备注名称"></div><div class="form-field"><label for="capacity">并发容量</label><input id="capacity" class="field" type="number" min="1" value="1"></div><div class="form-field"><label for="proxy">代理地址</label><input id="proxy" class="field" placeholder="可选"></div><div class="form-field"><label for="baseUrl">Base URL</label><input id="baseUrl" class="field" placeholder="可选"></div><div class="form-field"><label for="priority">路由优先级</label><input id="priority" class="field" type="number" value="0"></div><div class="form-field"><label>账号状态</label><label class="switch-line"><input id="enabled" type="checkbox" checked> 启用账号</label></div><div class="form-field"><label>连接选项</label><label class="switch-line"><input id="websockets" type="checkbox"> 启用 WebSocket</label></div><div class="form-field"><label>API 模式</label><label class="switch-line"><input id="usingApi" type="checkbox"> 使用 API 模式</label></div><div class="form-field full"><label for="note">备注</label><input id="note" class="field" placeholder="可选"></div></div><div class="drawer-foot"><button id="cancel" class="ghost">取消</button><button id="saveAuth" class="primary">保存账号</button></div></aside></div>
  <script>
    const keyEl=document.getElementById('key'),rowsEl=document.getElementById('rows'),errorEl=document.getElementById('error'),modal=document.getElementById('modal');
    const state={data:[],selected:new Set(),editing:null,autoTimer:null};
    keyEl.value=sessionStorage.getItem('cpa-management-key')||'';
    const headers=()=>({'X-Management-Key':keyEl.value.trim(),'Content-Type':'application/json'});
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=n=>Number(n||0).toLocaleString('zh-CN');
    const pct=(a,b)=>b?((Number(a||0)/Number(b))*100).toFixed(1)+'%':'-';
    const idKey=a=>String(a.id||'');
    const selectedAccounts=()=>state.data.filter(a=>state.selected.has(idKey(a)));
    function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),p=document.getElementById('provider').value,t=document.getElementById('type').value,s=document.getElementById('status').value;return state.data.filter(a=>{const u=a.usage||{},hay=[a.name,a.id,a.email,a.provider,a.type,a.status,a.project_id,a.account].join(' ').toLowerCase(),status=!a.enabled||a.disabled?'disabled':a.unavailable?'unavailable':'enabled';return(!q||hay.includes(q))&&(!p||a.provider===p)&&(!t||a.type===t)&&(!s||status===s)}).sort((a,b)=>(String(a.label||a.name||a.id).toLowerCase()).localeCompare(String(b.label||b.name||b.id).toLowerCase(),'zh-CN'))}
    function renderFilters(){const select=(id,values,label)=>{const el=document.getElementById(id),old=el.value;el.innerHTML='<option value="">'+label+'</option>'+values.filter(Boolean).sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(values.includes(old))el.value=old};select('provider',[...new Set(state.data.map(a=>a.provider))],'全部平台');select('type',[...new Set(state.data.map(a=>a.type))],'全部类型')}
    function render(){const list=filtered();document.getElementById('count').textContent=state.data.length;document.getElementById('summary').textContent='显示 '+list.length+' 个账号，共 '+state.data.length+' 个';document.getElementById('selected').textContent='已选择 '+state.selected.size+' 个';const all=list.length>0&&list.every(a=>state.selected.has(idKey(a)));document.getElementById('all').checked=all;rowsEl.innerHTML=list.map(a=>{const u=a.usage||{},display=esc(a.label||a.name||a.id),initial=esc((a.label||a.name||a.id||'?').slice(0,1).toUpperCase()),active=Number(a.active||0),capacity=Number(a.capacity||1),ratio=Math.min(100,capacity?active/capacity*100:0),unavailable=!!a.unavailable,status=!a.enabled||a.disabled?'停用':unavailable?'不可用':'正常',statusClass=!a.enabled||a.disabled?'off':unavailable?'warn':'',info=[a.email,a.account_type,a.project_id].filter(Boolean).map(esc).join(' · ')||'暂无';return '<tr><td><input class="check row-check" data-id="'+esc(idKey(a))+'" type="checkbox" '+(state.selected.has(idKey(a))?'checked':'')+' aria-label="选择 '+display+'"></td><td><div class="account"><span class="avatar">'+initial+'</span><span><span class="account-name">'+display+'</span><small class="sub">'+esc(a.email||a.name||a.id)+'</small></span></div></td><td><span class="metric">'+esc(a.id)+'</span><small class="sub">'+esc(a.auth_index||'')+'</small></td><td><div class="chips"><span class="chip">'+esc(a.provider||'未知平台')+'</span><span class="chip gray">'+esc(a.type||'未知类型')+'</span></div></td><td><div class="capacity"><input class="field cap" data-id="'+esc(idKey(a))+'" type="number" min="1" value="'+capacity+'"><em>并发</em></div></td><td><span class="metric">'+active+' / '+capacity+'</span><div class="meter"><i class="'+(ratio>=100?'warn':'')+'" style="width:'+ratio+'%"></i></div></td><td class="metric">'+fmt(u.requests)+'</td><td class="metric">'+pct(u.success,u.requests)+'</td><td class="metric">'+fmt(u.total_tokens)+'</td><td class="cost">$'+Number(u.cost_usd||0).toFixed(4)+'</td><td><span class="status '+statusClass+'">'+status+'</span></td><td><span class="sub">'+info+'</span><small class="sub">优先级 '+Number(a.priority||0)+(a.websockets?' · WS':'')+'</small></td><td><div class="row-actions"><button class="row-button edit" data-id="'+esc(idKey(a))+'">编辑</button><button class="row-button save" data-id="'+esc(idKey(a))+'">保存</button><button class="row-button '+(a.enabled?'danger':'')+' toggle" data-id="'+esc(idKey(a))+'">'+(a.enabled?'停用':'启用')+'</button></div></td></tr>'}).join('')||'<tr><td colspan="13" class="empty">没有符合条件的账号</td></tr>'}
    async function loadData(){const k=keyEl.value.trim();if(!k){errorEl.textContent='请先填写 CPA Management Key';return}sessionStorage.setItem('cpa-management-key',k);try{const r=await fetch('/v0/management/account-capacity/accounts',{headers:headers()});if(!r.ok)throw new Error('HTTP '+r.status+'：管理密钥无效或 CPA 管理接口不可用');const d=await r.json();state.data=d.accounts||[];state.selected=new Set([...state.selected].filter(id=>state.data.some(a=>idKey(a)===id)));renderFilters();errorEl.textContent='';render()}catch(e){errorEl.textContent=e.message}}
    async function update(a,enabled,capacity){const input=document.querySelector('.cap[data-id="'+CSS.escape(idKey(a))+'"]'),value=capacity??(input?Number(input.value):Number(a.capacity||1));if(!Number.isInteger(value)||value<1)throw new Error('容量必须是大于 0 的整数');const r=await fetch('/v0/management/account-capacity/accounts',{method:'PUT',headers:headers(),body:JSON.stringify({id:idKey(a),capacity:value,enabled})});if(!r.ok)throw new Error('保存失败：HTTP '+r.status)}
    async function updateSelected(enabled){const accounts=selectedAccounts();if(!accounts.length)return;try{const value=Math.max(1,Number(document.getElementById('bulkCapacity').value||1));for(const a of accounts)await update(a,enabled,value);await loadData()}catch(e){errorEl.textContent=e.message}}
    const formValue=id=>document.getElementById(id).value.trim();
    function resetForm(){['fileName','label','proxy','baseUrl','note','json'].forEach(id=>document.getElementById(id).value='');document.getElementById('capacity').value='1';document.getElementById('priority').value='0';['enabled','websockets','usingApi'].forEach(id=>document.getElementById(id).checked=id==='enabled');document.getElementById('filePicker').value='';state.editing=null;document.getElementById('drawerTitle').textContent='添加账号';document.getElementById('saveAuth').textContent='保存账号'}
    function openCreate(){resetForm();modal.classList.add('open');document.getElementById('fileName').focus()}
    async function openEdit(a){if(!a.auth_index){errorEl.textContent='此账号没有可用于编辑的 auth_index';return}try{const r=await fetch('/v0/management/account-capacity/accounts/auth?auth_index='+encodeURIComponent(a.auth_index),{headers:headers()});if(!r.ok)throw new Error('读取账号失败：HTTP '+r.status);const d=await r.json(),j=d.json||{};state.editing=a;document.getElementById('drawerTitle').textContent='编辑账号';document.getElementById('saveAuth').textContent='保存修改';document.getElementById('fileName').value=d.name||a.name;document.getElementById('json').value=JSON.stringify(j,null,2);document.getElementById('label').value=a.label||'';document.getElementById('capacity').value=a.capacity||1;document.getElementById('proxy').value=j['proxy-url']||j.proxy_url||'';document.getElementById('baseUrl').value=j['base-url']||j.base_url||'';document.getElementById('priority').value=a.priority||j.priority||0;document.getElementById('note').value=a.note||j.note||'';document.getElementById('enabled').checked=!!a.enabled;document.getElementById('websockets').checked=!!(a.websockets||j.websockets);document.getElementById('usingApi').checked=!!(j['using-api']||j.using_api);document.getElementById('filePicker').value='';modal.classList.add('open')}catch(e){errorEl.textContent=e.message}}
    function closeModal(){modal.classList.remove('open');state.editing=null}
    async function saveAuth(){const name=formValue('fileName'),jsonText=formValue('json');if(!name||!jsonText)throw new Error('文件名和认证 JSON 不能为空');let json;try{json=JSON.parse(jsonText)}catch(e){throw new Error('认证 JSON 格式错误：'+e.message)}if(!json||Array.isArray(json)||typeof json!=='object')throw new Error('认证 JSON 必须是对象');const body={name,json,capacity:Math.max(1,Number(document.getElementById('capacity').value||1)),enabled:document.getElementById('enabled').checked,label:formValue('label'),proxy_url:formValue('proxy'),base_url:formValue('baseUrl'),note:formValue('note'),priority:Number(document.getElementById('priority').value||0),websockets:document.getElementById('websockets').checked,using_api:document.getElementById('usingApi').checked};if(state.editing)body.auth_index=state.editing.auth_index;const r=await fetch('/v0/management/account-capacity/accounts/auth',{method:state.editing?'PUT':'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok){let message='保存账号失败：HTTP '+r.status;try{const d=await r.json();if(d.error)message=d.error}catch(e){}throw new Error(message)}closeModal();await loadData()}
    document.getElementById('load').onclick=loadData;document.getElementById('refresh').onclick=loadData;document.getElementById('add').onclick=openCreate;document.getElementById('close').onclick=closeModal;document.getElementById('cancel').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.getElementById('saveAuth').onclick=async()=>{try{await saveAuth()}catch(e){errorEl.textContent=e.message}};document.getElementById('filePicker').onchange=async e=>{const file=e.target.files[0];if(!file)return;document.getElementById('fileName').value=file.name;document.getElementById('json').value=await file.text()};document.getElementById('search').oninput=render;['provider','type','status'].forEach(id=>document.getElementById(id).onchange=render);document.getElementById('all').onchange=e=>{filtered().forEach(a=>e.target.checked?state.selected.add(idKey(a)):state.selected.delete(idKey(a)));render()};document.getElementById('rows').onclick=async e=>{const button=e.target.closest('button');if(!button)return;const a=state.data.find(x=>idKey(x)===button.dataset.id);if(!a)return;try{if(button.classList.contains('edit'))return await openEdit(a);if(button.classList.contains('save'))await update(a,a.enabled);else if(button.classList.contains('toggle'))await update(a,!a.enabled);await loadData()}catch(err){errorEl.textContent=err.message}};document.getElementById('rows').onchange=e=>{if(!e.target.classList.contains('row-check'))return;e.target.checked?state.selected.add(e.target.dataset.id):state.selected.delete(e.target.dataset.id);render()};document.getElementById('bulkSave').onclick=()=>updateSelected();document.getElementById('bulkEnable').onclick=()=>updateSelected(true);document.getElementById('bulkDisable').onclick=()=>updateSelected(false);document.getElementById('more').onclick=()=>document.getElementById('menu').classList.toggle('open');document.getElementById('reset').onclick=async()=>{document.getElementById('menu').classList.remove('open');if(!confirm('确定清空全部账号用量统计吗？'))return;try{const r=await fetch('/v0/management/account-capacity/reset-usage',{method:'POST',headers:headers()});if(!r.ok)throw new Error('清空失败：HTTP '+r.status);await loadData()}catch(e){errorEl.textContent=e.message}};document.getElementById('auto').onchange=e=>{clearInterval(state.autoTimer);state.autoTimer=e.target.checked?setInterval(loadData,30000):null};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  </script>
</body>
